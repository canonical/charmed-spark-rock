name: charmed-spark
summary: Charmed Apache Spark ROCK
description: |
  This is an OCI image that bundles Apache Spark binaries together with other
  tools of its ecosystem in order to be used in Charmed Operators, providing
  an automated and seamless experience to deploy, operate, manage and monitor
  SparkJob on K8s cluster.
  It is an open source, end-to-end, production ready data platform on top of
  cloud native technologies.

license: Apache-2.0

version: "3.5.9"

base: ubuntu@22.04

platforms:
  amd64:
  arm64:

run_user: _daemon_
entrypoint-service: sparkd

environment:
  SPARK_HOME: /opt/spark
  SPARK_CONFS: /etc/spark8t/conf
  SPARK_CONF_DIR: /etc/spark8t/conf
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-${CRAFT_ARCH_BUILD_FOR}
  PYTHONPATH: /opt/spark/python:/opt/spark8t/python/dist:/opt/spark/python/lib/py4j.zip:/usr/lib/python3.10/site-packages
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/spark:/opt/spark/bin:/opt/spark/python/bin:/opt/spark-client/python/bin
  HOME: /var/lib/spark
  SPARK_USER_DATA: /var/lib/spark
  SPARK_LOG_DIR: /var/log/spark
  PEBBLE_VERBOSE: "1"

services:
  sparkd:
    command: "/bin/bash /opt/pebble/sparkd.sh [ sleep ]"
    summary: "This is the service to startup Spark processes using the Spark entrypoint"
    override: replace
    startup: enabled
    on-success: shutdown
    on-failure: shutdown
  history-server:
    command: "/bin/bash /opt/pebble/history-server.sh"
    summary: "This is the Spark History Server service"
    override: replace
    startup: disabled
    # Not working in charms
    # working-dir: /opt/spark
    environment:
      SPARK_PROPERTIES_FILE: /etc/spark8t/conf/spark-defaults.conf

parts:
  spark:
    plugin: dump
    # renovate: datasource=github-releases depName=canonical/central-uploader depType=spark-source
    source: https://github.com/canonical/central-uploader/releases/download/spark-3.5.9-ubuntu2/spark-3.5.9-ubuntu2-20261104101119-bin-k8s.tgz
    source-checksum: sha512/a957b617c3956acf65ff3afe19e966afd55c5f81b09ef9c32cf7945771fe58e6a6d0e4876eeea7e988d1878a52a4c79890e9d1a068d5a1d067460cc259417c68
    overlay-script: |
      sed -i 's/http:\/\/deb.\(.*\)/https:\/\/deb.\1/g' /etc/apt/sources.list
      apt-get update
      ln -svf /lib /lib64
      apt-get install -y bash
      mkdir -p /opt/spark/python
      touch /opt/spark/RELEASE
      rm /bin/sh
      ln -svf /bin/bash /bin/sh
      echo "auth required pam_wheel.so use_uid" >> /etc/pam.d/su
      rm -rf /var/cache/apt/*
    organize:
      conf: etc/spark/conf
      jars: opt/spark/jars
      bin: opt/spark/bin
      sbin: opt/spark/sbin
      python: opt/spark/python
      kubernetes/dockerfiles/spark/entrypoint.sh: opt/spark/entrypoint.sh
      kubernetes/dockerfiles/spark/decom.sh: opt/spark/decom.sh
      examples: opt/spark/examples
      kubernetes/tests: opt/spark/tests
      data: opt/spark/data
    stage:
      - etc/spark/conf
      - opt/spark/jars
      - opt/spark/bin
      - opt/spark/sbin
      - opt/spark/entrypoint.sh
      - opt/spark/decom.sh
      - opt/spark/examples
      - opt/spark/tests
      - opt/spark/python
      - opt/spark/data

  authz-plugin:
    # Add the Spark AuthZ plugin coming from Kyuubi.
    plugin: dump
    after: [spark]
    source: https://github.com/canonical/central-uploader/releases/download/kyuubi-1.12.0-ubuntu3/kyuubi-1.12.0-ubuntu3-20261125155127.tgz
    source-checksum: sha512/55700b479cbe4b7acdec9459af33b761303075079667375021bf1e6f735ea872c6db4e672133dbc31ab3e8429def91bb7f55a7bc485155df06edfd02031551d0
    organize:
      extension/kyuubi-spark-authz-shaded-spark-3.5*.jar: opt/spark/jars/
    stage:
      - opt/spark/jars/*

  iceberg:
    # Add the dependencies required to interact with an iceberg catalog
    # pointing to the cloud object storages we support:
    # - iceberg-spark-runtime
    # - iceberg-aws-bundle
    # - iceberg-azure-bundle
    plugin: dump
    after: [spark]
    source: https://github.com/canonical/central-uploader/releases/download/iceberg-1.12.0-ubuntu0/iceberg-1.12.0-ubuntu0-20261106134103.tgz
    source-checksum: sha512/4a74d68428f0645c1faa508f1cf97369147d8d7f5be933e33da59680e47f35a3cd84f8607cc47f6e78b9f3d1beeff91450a6ba4c60b31381e8057b518ae49a95
    organize:
      iceberg-spark-runtime-3.5_2.12-1.12.0-ubuntu0.jar: opt/spark/jars/
      iceberg-aws-bundle-1.12.0-ubuntu0.jar: opt/spark/jars/
      iceberg-azure-bundle-1.12.0-ubuntu0.jar: opt/spark/jars/
    stage:
      - opt/spark/jars/*

  dependencies:
    # This part adds the additional dependencies required:
    # - spark-metrics
    # - servlet-filter
    # - prometheus exporter
    # - postgresql
    plugin: nil
    after: [spark]
    build-packages:
      - wget
    overlay-script: |
      mkdir -p $CRAFT_PART_INSTALL/opt/spark/jars
      cd $CRAFT_PART_INSTALL/opt/spark/jars

      # renovate: datasource=github-releases depName=canonical/central-uploader extractVersion=^spark-metrics-assembly-3.4-(?<version>.+)$
      SPARK_METRICS_VERSION='1.0.5'
      SPARK_METRICS_RUNTIME_VERSION='3.4'
      SHA512SUM_SPARK_METRICS_ASSEMBLY_JAR='5603f59fe6362bfc0e66c7da17b749b1d859fe29425aa067c6efe4393f9af59ac11d22c759ce5265938ebaabe97d5c42af21e2a8fed8aaeb52eaaf5b222a83c9'

      # renovate: datasource=github-releases depName=canonical/central-uploader extractVersion=^servlet-filters-(?<version>.+)$
      SERVLET_FILTERS_VERSION='0.0.1'
      SHA512SUM_SPARK_SERVLET_FILTER_JAR='ffeb809d58ef0151d513b09d4c2bfd5cc064b0b888ca45899687aed2f42bcb1ce9834be9709290dd70bd9df84049f02cbbff6c2d5ec3c136c278c93f167c8096'

      # renovate: datasource=maven depName=io.prometheus.jmx:jmx_prometheus_javaagent
      PROMETHEUS_JMX_EXPORTER_VERSION='0.20.0'
      SHA1SUM_PROMETHEUS_JMX_EXPORTER='7b8a98e3482cee8889698ef391b85c47a3c4ce5b'

      # renovate: datasource=maven depName=org.postgresql:postgresql
      POSTGRESQL_VERSION='42.7.13'
      SHA1SUM_POSTGRESQL='a6e1bd21b412d6ffb3df23cd13d507bc2cc9e37d'

      JARS=(
      "https://github.com/canonical/central-uploader/releases/download/spark-metrics-assembly-${SPARK_METRICS_RUNTIME_VERSION}-LIB_VERSION/spark-metrics-assembly-${SPARK_METRICS_RUNTIME_VERSION}-LIB_VERSION.jar $SPARK_METRICS_VERSION sha512sum $SHA512SUM_SPARK_METRICS_ASSEMBLY_JAR"
      "https://github.com/canonical/central-uploader/releases/download/servlet-filters-LIB_VERSION/servlet-filters-LIB_VERSION.jar $SERVLET_FILTERS_VERSION sha512sum $SHA512SUM_SPARK_SERVLET_FILTER_JAR"
      "https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/LIB_VERSION/jmx_prometheus_javaagent-LIB_VERSION.jar $PROMETHEUS_JMX_EXPORTER_VERSION sha1sum $SHA1SUM_PROMETHEUS_JMX_EXPORTER"
      "https://repo1.maven.org/maven2/org/postgresql/postgresql/LIB_VERSION/postgresql-LIB_VERSION.jar $POSTGRESQL_VERSION sha1sum $SHA1SUM_POSTGRESQL"
      )
      for ENTRY in "${JARS[@]}"; do
        echo "$ENTRY"
        URL_BASE=$(echo "$ENTRY" | awk '{print $1}')
        LIB_VERSION=$(echo "$ENTRY" | awk '{print $2}')
        SHA=$(echo "$ENTRY" | awk '{print $3}')
        EXPECTED_SHA=$(echo "$ENTRY" | awk '{print $4}')
        URL=$(echo "$URL_BASE" | sed "s/LIB_VERSION/$LIB_VERSION/g")
        JAR_FILE=$(echo "${URL##*/}")
        echo "Download from URL: $URL"
        wget -q "$URL"
        ACTUAL_SHA=$("$SHA" "$JAR_FILE" | awk '{print $1}')
        echo "$ACTUAL_SHA"
        echo "$EXPECTED_SHA"
        [ $ACTUAL_SHA != $EXPECTED_SHA ] && echo "ERROR"  && exit 1
      done

      echo "All dependencies downloaded!"
    stage:
      - opt/spark/jars

  spark8t:
    plugin: python
    source: ""
    stage-packages:
      - python3-venv
    python-packages:
      # renovate: datasource=pypi
      - spark8t==1.6.0
    organize:
      lib/python3.*/site-packages/*: opt/spark8t/python/dist/

  charmed-spark:
    plugin: dump
    after: [spark8t, spark]
    source: .
    organize:
      conf/spark-defaults.conf: etc/spark8t/conf/spark-defaults.conf
      conf/jmx_prometheus.yaml: etc/spark/conf/jmx_prometheus.yaml
      bin/sparkd.sh: opt/pebble/sparkd.sh
      bin/history-server.sh: opt/pebble/history-server.sh
      bin/spark-client.pyspark: opt/spark-client/python/bin/spark-client.pyspark
      bin/spark-client.spark-sql: opt/spark-client/python/bin/spark-client.spark-sql
      bin/spark-client.service-account-registry: opt/spark-client/python/bin/spark-client.service-account-registry
      bin/spark-client.spark-shell: opt/spark-client/python/bin/spark-client.spark-shell
      bin/spark-client.spark-submit: opt/spark-client/python/bin/spark-client.spark-submit
      pebble/log-layer.yaml: opt/pebble/log-layer.yaml
    stage:
      - etc/spark8t/conf/
      - etc/spark/conf/
      - opt/pebble/sparkd.sh
      - opt/pebble/history-server.sh
      - opt/spark-client/python/bin/spark-client.pyspark
      - opt/spark-client/python/bin/spark-client.spark-sql
      - opt/spark-client/python/bin/spark-client.service-account-registry
      - opt/spark-client/python/bin/spark-client.spark-shell
      - opt/spark-client/python/bin/spark-client.spark-submit
      - opt/pebble/log-layer.yaml

  user-setup:
    plugin: nil
    after: [charmed-spark]
    overlay-packages:
      - tini
      - libc6
      - libpam-modules
      - krb5-user
      - libnss3
      - procps
      - openjdk-17-jre-headless

    override-prime: |
      # Please refer to https://discourse.ubuntu.com/t/unifying-user-identity-across-snaps-and-rocks/36469
      # for more information about shared user.
      SPARK_GID=584792
      SPARK_UID=584792

      craftctl default
      chmod 755 opt/spark-client/python/bin/*

      chown -R ${SPARK_GID}:${SPARK_UID} etc/spark etc/spark8t
      chmod -R 750 etc/spark etc/spark8t

      mkdir -p var/log/spark
      chown -R ${SPARK_GID}:${SPARK_UID} var/log/spark
      chmod -R 750 var/log/spark

      # Create a symlink to py4j
      (
        cd opt/spark/python/lib
        ln -s py4j-*-src.zip py4j.zip
      )

      # This is needed to run the spark job, as it requires RW+ access on the spark folder
      chown -R ${SPARK_GID}:${SPARK_UID} opt/spark
      chmod -R 750 opt/spark

      mkdir -p var/lib/spark
      mkdir -p var/lib/spark/notebook
      chown -R ${SPARK_GID}:${SPARK_UID} var/lib/spark
      chmod -R 770 var/lib/spark
      mv opt/spark/decom.sh opt/decom.sh
      chmod a+x opt/decom.sh
