name: GPU integration CI pipeline

on:
  pull_request:
  workflow_call:

jobs:
  build-rock:
    uses: ./.github/workflows/build_gpu.yaml

  start-runners:
    name: Start self-hosted EC2 runners
    needs: [build-rock]
    runs-on: ubuntu-22.04
    outputs:
      label-amd: ${{ steps.start-ec2-runner-amd.outputs.label }}
      ec2-instance-id-amd: ${{ steps.start-ec2-runner-amd.outputs.ec2-instance-id }}
      label-arm: ${{ steps.start-ec2-runner-arm.outputs.label }}
      ec2-instance-id-arm: ${{ steps.start-ec2-runner-arm.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 runner amd
        id: start-ec2-runner-amd
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: start
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          ec2-image-id: ${{ vars.AWS_EC2_IMAGE_ID_AMD }}
          ec2-instance-type: ${{ vars.AWS_EC2_INSTANCE_TYPE_AMD }}
          subnet-id: ${{ vars.AWS_DEFAULT_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID }}

      - name: Start EC2 runner arm
        id: start-ec2-runner-arm
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: start
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          ec2-image-id: ${{ vars.AWS_EC2_IMAGE_ID_AM }}
          ec2-instance-type: ${{ vars.AWS_EC2_INSTANCE_TYPE_ARM }}
          subnet-id: ${{ vars.AWS_DEFAULT_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID }}

  integration-tests:
    name: Run integration tests
    needs: [start-runners]
    runs-on: ${{ matrix.system.os }}
    strategy:
      matrix:
        system:
          - os: ${{ needs.start-runners.outputs.label-amd }}
            arch: amd64
          - os: ${{ needs.start-runners.outputs.label-arm }}
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        run: |
          sudo -E bash ./tests/integration/setup-environment.sh
        env:
          MICROK8S_CHANNEL: 1.32/stable

      - name: Setup microk8s
        run: sudo -E /bin/bash ./tests/integration/config-microk8s-gpu.sh
        env:
          MICROK8S_ADDONS: "storage dns rbac nvidia minio"

      - name: Configure microk8s
        run: |
          sudo microk8s.status
          sudo snap alias microk8s.kubectl kubectl
          mkdir -p /home/ubuntu/.kube
          sudo chown -f -R ubuntu /home/ubuntu/.kube
          sudo microk8s config | tee /home/ubuntu/.kube/config

      - name: Install required packages/snaps
        run: |
          sudo systemctl stop unattended-upgrades
          sudo apt-get update
          sudo apt-get install build-essential -yqq
          sudo snap install yq

      - name: Get Artifact Name
        id: artifact
        run: |
          GPU_ARTIFACT=$(make help FLAVOUR=gpu | grep 'Artifact: ')
          echo "gpu_artifact_name=${GPU_ARTIFACT#'Artifact: '}" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: charmed-spark-gpu-${{ matrix.system.arch }}
          path: charmed-spark

      - name: Load image
        run: |
          # Unpack Artifact
          mv charmed-spark/${{ steps.artifact.outputs.gpu_artifact_name }} .
          touch .make_cache/k8s.tag
          # Import artifact into microk8s to be used in integration tests
          sudo make microk8s-import FLAVOUR=gpu PREFIX=test- REPOSITORY=ghcr.io/canonical/ \
            -o ${{ steps.artifact.outputs.gpu_artifact_name }}

      - name: Run integration tests on GPU
        run: |
          echo "Start test..."
          /bin/bash ./tests/integration/setup-aws-cli.sh
          /bin/bash ./tests/integration/integration-tests-gpu.sh
          echo "End of the test :)"
        env:
          KUBECONFIG: "/home/ubuntu/.kube/config"
          USER: "ubuntu"

  stop-runners:
    name: Stop self-hosted EC2 runners
    needs:
      - start-runners
      - integration-tests
    runs-on: ubuntu-22.04
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop EC2 runner amd
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: stop
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          label: ${{ needs.start-runners.outputs.label-amd }}
          ec2-instance-id: ${{ needs.start-runners.outputs.ec2-instance-id-arm }}

      - name: Stop EC2 runner arm
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: stop
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          label: ${{ needs.start-runners.outputs.label-arm }}
          ec2-instance-id: ${{ needs.start-runners.outputs.ec2-instance-id-arm }}
