name: GPU integration CI pipeline

on:
  pull_request:
  workflow_call:

jobs:
  build-rock:
    uses: ./.github/workflows/build_gpu.yaml

  start-runners:
    name: Start self-hosted EC2 runners
    needs: [build-rock]
    runs-on: ubuntu-22.04
    outputs:
      label-amd: ${{ steps.start-ec2-runner-amd.outputs.label }}
      ec2-instance-id-amd: ${{ steps.start-ec2-runner-amd.outputs.ec2-instance-id }}
      label-arm: ${{ steps.start-ec2-runner-arm.outputs.label }}
      ec2-instance-id-arm: ${{ steps.start-ec2-runner-arm.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 runner amd
        id: start-ec2-runner-amd
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: start
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          ec2-image-id: ${{ vars.AWS_EC2_IMAGE_ID_AMD }}
          # ec2-instance-type: ${{ vars.AWS_EC2_INSTANCE_TYPE_AMD }}
          ec2-instance-type: g4dn.2xlarge
          subnet-id: ${{ vars.AWS_DEFAULT_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID }}

      - name: Start EC2 runner arm
        id: start-ec2-runner-arm
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: start
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          ec2-image-id: ${{ vars.AWS_EC2_IMAGE_ID_ARM }}
          # ec2-instance-type: ${{ vars.AWS_EC2_INSTANCE_TYPE_ARM }}
          ec2-instance-type: g5g.4xlarge
          subnet-id: ${{ vars.AWS_DEFAULT_SUBNET_ID }}
          security-group-id: ${{ vars.AWS_SECURITY_GROUP_ID }}

  integration-tests:
    name: Run integration tests
    needs: [start-runners]
    runs-on: ${{ matrix.system.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: ${{ needs.start-runners.outputs.label-amd }}
            arch: amd64
          - os: ${{ needs.start-runners.outputs.label-arm }}
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup environment
        run: |
          sudo systemctl disable --now unattended-upgrades.service
          sudo apt autoremove unattended-upgrades -y
          sudo apt update
          sudo apt install build-essential -yqq

          sudo snap install concierge --classic
          sudo concierge prepare

          mkdir -p /home/ubuntu/.kube
          sudo chown -f -R ubuntu /home/ubuntu/.kube
          sudo k8s config | tee /home/ubuntu/.kube/config

      - name: Deploy gpu operator
        timeout-minutes: 10
        run: |
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update
          KUBECONFIG=/home/ubuntu/.kube/config helm install --generate-name -n gpu-operator-resources --create-namespace nvidia/gpu-operator
          # Wait for gpu operator components to be ready
          while ! sudo kubectl logs -n gpu-operator-resources -l app=nvidia-operator-validator | grep "all validations are successful"
          do
              echo "--------------------------------------------------------------------------------------------------------------------"
              echo "waiting for validations"
              sudo kubectl get pods -n gpu-operator-resources
              sleep 60
              echo "--------------------------------------------------------------------------------------------------------------------"
          done

      - name: Setup object storage
        run: |
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,1G,3
          sudo microceph enable rgw
          sudo microceph.radosgw-admin user create --uid test --display-name test --access-key=foo --secret-key=bar
          aws configure set aws_access_key_id foo
          aws configure set aws_secret_access_key bar
          aws configure set endpoint_url "http://$(ip -4 -j route get 2.2.2.2 | yq -r '.[] | .prefsrc'):80"
          aws s3 ls

      - name: Get Artifact Name
        id: artifact
        run: |
          GPU_ARTIFACT=$(make help FLAVOUR=gpu | grep 'Artifact: ')
          echo "gpu_artifact_name=${GPU_ARTIFACT#'Artifact: '}" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: charmed-spark-gpu-test-${{ matrix.system.arch }}
          path: charmed-spark

      - name: Load test image
        run: |
          sudo mkdir /var/snap/k8s/common/images
          sudo cp charmed-spark/test_image.tar /var/snap/k8s/common/images/
          sudo snap restart k8s.containerd
          sleep 30
          if [ -z "$(sudo /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock --namespace k8s.io images list -q | grep test-charmed-spark)" ]; then
            sleep 30
            if [ -z "$(sudo /snap/k8s/current/bin/ctr --address /run/containerd/containerd.sock --namespace k8s.io images list -q | grep test-charmed-spark)" ]; then
              echo "Test image not loaded"
              exit 1
            fi
          fi

      - name: Run integration tests on GPU
        run: |
          echo "Start test..."
          export S3_ACCESS_KEY=foo
          export S3_SECRET_KEY=bar
          export S3_ENDPOINT="http://$(ip -4 -j route get 2.2.2.2 | yq -r '.[] | .prefsrc'):80"
          /bin/bash ./tests/integration/integration-tests-gpu.sh
          echo "End of the test :)"
        env:
          KUBECONFIG: "/home/ubuntu/.kube/config"
          USER: "ubuntu"

  stop-runners:
    name: Stop self-hosted EC2 runners
    needs:
      - start-runners
      - integration-tests
    runs-on: ubuntu-22.04
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop EC2 runner amd
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: stop
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          label: ${{ needs.start-runners.outputs.label-amd }}
          ec2-instance-id: ${{ needs.start-runners.outputs.ec2-instance-id-amd }}

      - name: Stop EC2 runner arm
        uses: machulav/ec2-github-runner@v2.4.1
        with:
          mode: stop
          github-token: ${{ secrets.WELPAOLO_GITHUB_TOKEN }}
          label: ${{ needs.start-runners.outputs.label-arm }}
          ec2-instance-id: ${{ needs.start-runners.outputs.ec2-instance-id-arm }}
